<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Bold.otf"); font-weight: 700; }
  @font-face { font-family: Inter; src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf"); font-weight: 500; }
  html, body { margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; background: #0B0D12; color: #F2F4F8; font-family: Inter, sans-serif; position: relative; }
  .glow { position: absolute; left: -160px; top: -180px; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(182,242,58,.20), rgba(182,242,58,.06) 55%, transparent); }
  .glow2 { position: absolute; right: -200px; bottom: -260px; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(90,110,255,.16), transparent); }
  .left { position: absolute; left: 72px; top: 92px; width: 500px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .dot { width: 34px; height: 34px; border-radius: 50%; background: #B6F23A;
    box-shadow: 0 0 18px 4px rgba(182,242,58,.75), 0 0 60px 18px rgba(182,242,58,.28); }
  .name { font-size: 64px; font-weight: 700; letter-spacing: .005em; }
  h1 { margin: 54px 0 0; font-size: 50px; line-height: 1.08; font-weight: 700; }
  h1 em { font-style: normal; color: #B6F23A; }
  p { margin: 22px 0 0; font-size: 21px; line-height: 1.5; color: #C4CAD4; font-weight: 500; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .tags span { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.08); color: #D5DBE6; font-size: 15px; font-weight: 500; }
  .shot { position: absolute; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.08); }
  .shot img { display: block; width: 100%; }
  .s1 { width: 640px; left: 610px; top: 58px; transform: rotate(-2deg); }
  .s2 { width: 470px; left: 790px; top: 330px; transform: rotate(3deg); }
  .s3 { width: 360px; left: 620px; top: 382px; transform: rotate(-5deg); }
</style></head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="shot s1"><img src="../images/02-guide-direct.png" alt=""></div>
  <div class="shot s3"><img src="../images/04-bibliotheque.png" alt=""></div>
  <div class="shot s2"><img src="../images/03-mosaique.png" alt=""></div>
  <div class="left">
    <div class="brand"><span class="dot"></span><span class="name">luciole</span></div>
    <h1 id="slogan">Petite lumière,<br><em>grand écran.</em></h1>
    <p id="sub">Le direct, les films et les séries de vos abonnements IPTV, sur votre téléviseur Samsung.</p>
    <div class="tags" id="tags"><span>Plusieurs abonnements</span><span>Mosaïque</span><span>Bibliothèque</span><span>Replay</span><span>FR · EN</span></div>
  </div>
</body></html>
