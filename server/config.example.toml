# Configuration du serveur Luciole
# Fichier à placer dans /etc/luciole/config.toml (l'installation le fait pour vous).
# Ce fichier contient vos identifiants : il n'est lisible que par root et par Luciole.

# ---------------------------------------------------------------------------
# Abonnements IPTV : un bloc [[xtream]] par abonnement.
# Pour un second abonnement, copiez le bloc entier en dessous du premier.
# ---------------------------------------------------------------------------
[[xtream]]
# Nom affiché dans l'appli et sur la page web
nom = "Mon abonnement"
# Identifiant court, en minuscules. Il relie vos favoris, votre historique et vos
# bouquets à cet abonnement : choisissez-le une fois et n'y touchez plus.
id = "principal"
# Adresse du serveur de l'abonnement, avec le port s'il y en a un (sans / à la fin)
server = "http://adresse-du-fournisseur:8080"
username = "votre_identifiant"
password = "votre_mot_de_passe"

# Format du direct : "ts" (le plus courant) ou "m3u8" (à essayer si certaines chaînes coupent)
live_format = "ts"
# Guide des programmes : laissez vide pour utiliser celui du fournisseur
epg_url = ""
# Replay : forme de l'adresse demandée au fournisseur.
# "path" (le plus courant) : /timeshift/... ; "php" : /streaming/timeshift.php?...
# Si le replay ne démarre jamais alors que la chaîne en a un, essayez "php".
replay_format = "path"
# Fuseau horaire du fournisseur pour le replay. Vide = celui annoncé par le fournisseur.
# Si les replays démarrent avec une heure de décalage, mettez par exemple "Europe/Paris" ou "UTC".
replay_timezone = ""
# Avec plusieurs abonnements, les numéros de chaînes se télescopent souvent (deux chaînes 1).
# « decalage » est ajouté à tous les numéros de cet abonnement : 1000 fait de la chaîne 1 la 1001.
decalage = 0
# Pastille de provenance (lettre sur un rond de couleur), aussi réglable depuis la page web.
# Vide = automatique.
lettre = ""
couleur = ""

# Exemple de second abonnement :
# [[xtream]]
# nom = "Abonnement sport"
# id = "sport"
# server = "http://autre-fournisseur:80"
# username = "..."
# password = "..."
# decalage = 1000

[server]
listen = "0.0.0.0"
port = 8765
# Mot de passe optionnel entre la TV et ce serveur (vide = aucun, suffisant sur le réseau de la maison)
token = ""
data_dir = "/var/lib/luciole"

[sync]
# Nombre d'heures de guide à garder
epg_hours = 36
# Délai d'attente maximum pour le fournisseur, en secondes
timeout = 60

[medias]
# Médiathèque personnelle : vos films et séries posés sur un NAS ou un disque,
# montés quelque part sur CE serveur (voir LISEZMOI.md). Les dossiers eux-mêmes
# s'ajoutent depuis la page web, section Médiathèque.
#
# Clé TMDB (gratuite, à créer sur themoviedb.org : Paramètres > API > clé v3).
# Elle n'est PAS nécessaire si vos dossiers sont déjà rangés par tinyMediaManager,
# Jellyfin ou Kodi : Luciole lit alors les .nfo, les affiches déjà présentes et
# l'identifiant {tmdb-123} inscrit dans le nom du dossier.
# Elle sert aux fichiers non balisés, dont il faut chercher le titre, et aux jaquettes.
tmdb_key = ""
# Langue des fiches
langue = "fr-FR"
# Délai d'attente pour TMDB, en secondes
timeout = 20
# Écriture dans les dossiers : false = Luciole ne fait que lire vos fichiers.
# true = la page web propose de convertir le son que le téléviseur ne lit pas
# (DTS, TrueHD) en AC3 ; Luciole réécrit alors le fichier. Il faut que les dossiers
# soient montés en écriture pour l'utilisateur « luciole », et que ffmpeg soit installé.
# Le script d'installation pose la question ; redémarrez Luciole après un changement ici.
ecriture = false

[tv]
# Démarrage automatique : quand le téléviseur s'allume, le serveur lui demande
# d'ouvrir Luciole à la place de Samsung TV Plus. Tizen ne permet pas à une appli
# installée en mode développeur de se déclarer appli de démarrage : le serveur le
# fait donc depuis l'extérieur.
#
# Tout se règle plus simplement depuis la page web (section Téléviseur) ou depuis
# le téléviseur (Réglages) : les valeurs choisies là passent avant celles d'ici.
#
# host   : adresse du téléviseur sur le réseau (donnez-lui une adresse fixe
#          dans votre modem, sinon elle changera un jour et le réveil s'arrêtera)
# app    : identifiant de l'application ; celui de Luciole est LucioleApp.Luciole
# delai  : secondes d'attente après l'allumage, le temps que le téléviseur
#          finisse de démarrer
# essais : nombre de demandes successives ; Luciole est relancé tant qu'il n'est
#          pas à l'écran, car TV Plus reprend parfois la main une seconde
host = ""
app = "LucioleApp.Luciole"
demarrage_auto = false
delai = 6
essais = 6

[filtres]
# Règles automatiques pour masquer des bouquets (catégories) des fournisseurs.
# Elles s'appliquent aussi aux bouquets que les fournisseurs ajouteront plus tard,
# et à tous les abonnements.
# * remplace n'importe quel texte. Majuscules et accents ne comptent pas.
# Les choix faits à la main sur la page web passent avant ces règles.
#
# « garder » : si la liste n'est pas vide, SEULS les bouquets qui correspondent restent visibles.
# « masquer » : les bouquets qui correspondent sont cachés.
#
# Exemples :
#   direct_garder  = ["BE *", "FR *", "*belgique*", "*france*"]
#   direct_masquer = ["*adult*", "*xxx*", "*24/7*"]
#   films_masquer  = ["AR *", "TR *", "*bollywood*"]
direct_garder = []
direct_masquer = []
films_garder = []
films_masquer = []
series_garder = []
series_masquer = []
